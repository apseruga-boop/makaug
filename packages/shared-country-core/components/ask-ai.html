<section id="home-ask-ai-feature" data-ask-ai-results-hero="1" data-ask-ai-blue-categoryrouting="1" data-ask-ai-fast-mobile="1" data-ask-ai-similar-closeout="1" data-ask-ai-placeholder-i18n-live="1" data-ask-ai-clean-singlebar="1" data-ask-ai-topbar-match="1" data-ask-ai-topbar-match-marker="ask-ai-topbar-match-20260718" class="py-4 md:py-5 bg-[#f8fbf9]">
      <div class="max-w-7xl mx-auto px-4">
        <div class="ask-ai-search-shell" data-ai-search-shell data-ai-scope="all">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div class="min-w-0">
              <h2 id="home-ai-title" class="ask-ai-search-title">Describe what you want</h2>

              <span class="ask-ai-search-icon" aria-hidden="true">✨</span>
