<!doctype html>
<!-- One page for every makaug film: film.html?film=agent-intro&t=12.5 draws that film at 12.5 seconds; &lang=lg or &lang=sw draws it in Luganda or Swahili. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="film.css">
<script src="engine.js"></script>
<script src="transcript.js"></script>
<script>
  const query = new URLSearchParams(location.search);
  const name = query.get('film') || 'agent-intro';
  const lang = (query.get('lang') || '').replace(/[^a-z]/g, '');
  if (lang && lang !== 'en') document.write(`<script src="lang/${lang}.js"><\/script>`);
  document.write(`<script src="films/${name.replace(/[^a-z0-9-]/g, '')}.js"><\/script>`);
</script>
</head>
<body></body>
</html>
