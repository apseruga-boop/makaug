<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">makaug.com welcome card for Uganda property agents</title>
  <desc id="desc">A warm branded card inviting Uganda agents and brokers to list genuine property for free on makaug.com with WhatsApp help and nine languages.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3fff7"/>
      <stop offset="0.56" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#fff4cc"/>
    </linearGradient>
    <linearGradient id="brandGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#2f8f4e"/>
    </linearGradient>
    <linearGradient id="goldWash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7db"/>
      <stop offset="1" stop-color="#f6bd38"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="softGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#14532d" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#pageBg)"/>
  <rect width="1200" height="630" fill="url(#softGrid)"/>
  <circle cx="1052" cy="84" r="96" fill="#f6bd38" opacity="0.26"/>
  <circle cx="139" cy="546" r="128" fill="#2f8f4e" opacity="0.11"/>
  <path d="M82 480c145-14 242-67 323-160" fill="none" stroke="#2f8f4e" stroke-width="17" stroke-linecap="round" opacity="0.15"/>
  <path d="M820 566c74-78 160-114 265-108" fill="none" stroke="#2463eb" stroke-width="14" stroke-linecap="round" opacity="0.12"/>

  <g transform="translate(46 42)">
    <rect width="1108" height="546" rx="44" fill="#ffffff" filter="url(#softShadow)"/>
    <rect width="332" height="546" rx="44" fill="url(#brandGreen)"/>
    <path d="M288 0h88v546h-88z" fill="url(#brandGreen)"/>
    <path d="M0 420c104-35 190-92 288-194" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.12"/>
    <path d="M35 486c95-16 171-54 230-112" fill="none" stroke="#f6bd38" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

    <g transform="translate(46 42)">
      <rect x="0" y="0" width="70" height="70" rx="19" fill="#ffffff"/>
      <text x="35" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#2f7d43">M</text>
      <text x="88" y="35" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffffff">makaug<tspan fill="#f6bd38">.com</tspan></text>
      <text x="90" y="64" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#dff7e4" letter-spacing="1.8">UGANDA PROPERTY</text>
    </g>

    <g transform="translate(46 174)">
      <rect x="0" y="0" width="235" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
      <text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#ffffff">For agents and brokers</text>
      <text x="0" y="118" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900" fill="#ffffff">Built in Uganda</text>
      <text x="0" y="164" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900" fill="#ffffff">for genuine</text>
      <text x="0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900" fill="#ffffff">property leads</text>
      <text x="0" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#dff7e4">Free listing. WhatsApp help.</text>
      <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#dff7e4">Nine language flows.</text>
    </g>

    <g transform="translate(404 80)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="950" fill="#111827">Uganda agents,</text>
      <text x="0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="950" fill="#2f7d43">list property</text>
      <text x="0" y="128" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="950" fill="#2f7d43">for free</text>
      <text x="0" y="188" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="750" fill="#374151">A respectful invitation to show genuine</text>
      <text x="0" y="221" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="750" fill="#374151">property online.</text>

      <g transform="translate(0 266)">
        <rect x="0" y="0" width="190" height="62" rx="18" fill="#ecfdf3"/>
        <text x="95" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#2f7d43">Free to list</text>
        <rect x="208" y="0" width="202" height="62" rx="18" fill="#eef4ff"/>
        <text x="309" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#2463eb">9 languages</text>
        <rect x="0" y="78" width="252" height="62" rx="18" fill="#fff8e5"/>
        <text x="126" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#a16207">WhatsApp help</text>
      </g>

      <g transform="translate(284 344)">
        <rect x="0" y="0" width="438" height="76" rx="20" fill="#111827"/>
        <text x="28" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="950" fill="#ffffff">Start: makaug.com/list-property</text>
      </g>
    </g>

    <g transform="translate(910 94)">
      <rect x="0" y="0" width="158" height="332" rx="34" fill="#111827"/>
      <rect x="15" y="18" width="128" height="296" rx="26" fill="#f8faf7"/>
      <rect x="31" y="44" width="96" height="34" rx="17" fill="#2f7d43"/>
      <text x="79" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#ffffff">makaug.com</text>
      <rect x="28" y="107" width="102" height="84" rx="19" fill="#ffffff"/>
      <text x="79" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="950" fill="#2f7d43">9</text>
      <text x="79" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#111827">languages</text>
      <text x="79" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#2463eb">Sale | Rent</text>
      <text x="79" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#2f7d43">Land | Students</text>
      <text x="79" y="276" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#a16207">Commercial</text>
    </g>
  </g>
</svg>
