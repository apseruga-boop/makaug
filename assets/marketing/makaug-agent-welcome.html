<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MakaUg Agent Launch Welcome</title>
  <meta name="description" content="List Uganda properties free on makaug.com. Built for agents, brokers, landlords, students, renters, land seekers, and commercial clients in seven languages.">
  <link rel="canonical" href="https://makaug.com/assets/marketing/makaug-agent-welcome.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://makaug.com/assets/marketing/makaug-agent-welcome.html">
  <meta property="og:title" content="MakaUg is live: Uganda agents can list free today">
  <meta property="og:description" content="Free property posting, seven languages, WhatsApp-friendly enquiries, and launch visibility for Uganda agents and brokers.">
  <meta property="og:image" content="https://makaug.com/assets/marketing/makaug-agent-welcome-card.png">
  <meta property="og:image:secure_url" content="https://makaug.com/assets/marketing/makaug-agent-welcome-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MakaUg is live: list properties free today">
  <meta name="twitter:description" content="A Uganda-first property marketplace for agents, brokers, owners, renters, students, land, and commercial property.">
  <meta name="twitter:image" content="https://makaug.com/assets/marketing/makaug-agent-welcome-card.png">
  <style>
    :root {
      color-scheme: light;
      --green: #2f7d43;
      --gold: #f6bd38;
      --ink: #111827;
      --muted: #4b5563;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #f7fff5, #e7f3ff 52%, #fff6d9);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(980px, 100%);
      display: grid;
      gap: 18px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
    }
    section {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(47, 125, 67, 0.16);
      border-radius: 18px;
      padding: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/marketing/makaug-agent-welcome-card.png" width="1200" height="630" alt="MakaUg launch welcome card for Uganda agents and brokers">
    <section>
      <h1>MakaUg is live</h1>
      <p>Agents, brokers, agencies, and private owners can list properties free during launch onboarding. The website supports seven languages and helps buyers, renters, students, land seekers, and commercial clients find Uganda property faster.</p>
      <a href="/list-property">List a property free</a>
    </section>
  </main>
</body>
</html>
