  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* top: what you are looking at, and the main buttons */

  #bar { position: fixed; left: calc(var(--pad) + var(--sl)); right: calc(var(--pad) + var(--sr)); top: calc(var(--pad) + var(--st)); display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: flex-end; gap: 8px; pointer-events: none; }

  .btn:hover { background: rgba(34,40,46,.86); }

  .card { width: min(520px, 100%); padding: 26px 26px 20px; border-radius: 22px; position: relative; margin: auto; } /* margin: auto centres it, and a card taller than a small screen can still be scrolled from its top */

</div>
</div>
