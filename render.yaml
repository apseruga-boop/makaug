services:
  - type: web
    name: makaug-whatsapp-ai-runtime
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/whatsapp-ai-runtime.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: COUNTRY_CODE
        value: UG
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT
        sync: false
      - key: OPENAI_ORGANIZATION
        sync: false
      - key: WHATSAPP_AI_RUNTIME_TOKEN
        sync: false
      - key: WHATSAPP_AI_WORKER_FRESH_SECONDS
        value: "180"

  - type: worker
    name: makaug-whatsapp-agent
    runtime: docker
    dockerfilePath: ./Dockerfile.whatsapp-agent
    dockerContext: .
    plan: standard
    region: oregon
    numInstances: 1
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    disk:
      name: whatsapp-profile
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_DELIVERY_MODE
        value: web_bridge
      - key: WHATSAPP_API_VERSION
        value: v25.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEB_BRIDGE_ENABLED
        value: "true"
      - key: WHATSAPP_WEB_BRIDGE_TOKEN
        sync: false
      - key: WHATSAPP_WEB_COPILOT_BASE_URL
        value: https://makaug.com
      - key: WHATSAPP_WEB_COPILOT_CLIENT_ID
        value: makaug-whatsapp-web-prod
      - key: WHATSAPP_WEB_COPILOT_OPERATOR_NAME
        value: Render WhatsApp Agent
      - key: WHATSAPP_WEB_COPILOT_PROFILE_DIR
        value: /var/data/whatsapp-profile-live
      - key: WHATSAPP_WEB_COPILOT_HEADLESS
        value: "true"
      - key: WHATSAPP_WEB_COPILOT_HOSTED
        value: "true"
      - key: WHATSAPP_WEB_COPILOT_LOGIN_METHOD
        value: auto
      - key: WHATSAPP_WEB_COPILOT_PAIRING_PHONE
        sync: false
      - key: WHATSAPP_WEB_COPILOT_POLL_MS
        value: "750"
      - key: WHATSAPP_WEB_COPILOT_RECENT_SWEEP_MS
        value: "3000"
      - key: WHATSAPP_WEB_COPILOT_FAST_LANE_SWEEP_MS
        value: "900"
      - key: WHATSAPP_WEB_COPILOT_OUTBOX_POLL_MS
        value: "1000"
      - key: WHATSAPP_WEB_COPILOT_MAX_SESSION_MS
        value: "14400000"
      - key: WHATSAPP_WEB_COPILOT_HEARTBEAT_MS
        value: "30000"
      - key: WHATSAPP_AI_RUNTIME_URL
        value: https://makaug-whatsapp-ai-runtime.onrender.com
      - key: WHATSAPP_AI_RUNTIME_TOKEN
        sync: false
