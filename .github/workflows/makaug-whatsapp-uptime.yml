name: MakaUG WhatsApp uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: makaug-whatsapp-uptime
  cancel-in-progress: true

jobs:
  verify:
    name: WhatsApp bridge ready to reply
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The bot runs on WAHA (makaug-waha) + makaug-waha-bridge. The old check
      # called makaug-whatsapp-ai-runtime /ready, which waits for the suspended
      # Playwright worker and has failed since 13 Sep 2026 (issue #355).
      # Don't resume makaug-whatsapp-agent-docker: it would double-reply.
      - name: Verify the WhatsApp bridge is ready to reply
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 \
            https://makaug-waha-bridge.onrender.com/health)"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            const problems = [];
            if (payload.ready_to_reply !== true) problems.push("ready_to_reply is not true");
            if (payload.waha_status !== "WORKING") problems.push(`waha_status is ${JSON.stringify(payload.waha_status)}, not "WORKING"`);
            if (payload.bridge_status !== "online") problems.push(`bridge_status is ${JSON.stringify(payload.bridge_status)}, not "online"`);
            if (payload.makaug_link?.ok !== true) problems.push("makaug_link.ok is not true");
            if (problems.length) throw new Error(`WhatsApp bridge not ready: ${problems.join("; ")}`);
            console.log("WhatsApp bridge ready to reply");
          ' "$response"

      - name: Verify production remains available
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://makaug.com/api/health >/dev/null

      - name: Open or update WhatsApp outage incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Incident] MakaUG WhatsApp bot is offline';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const body = [
              'The five-minute production check found that the WhatsApp bridge (makaug-waha-bridge `/health`) is not ready to reply, or makaug.com/api/health is down.',
              '',
              `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The bot must not be treated as restored until the bridge reports `ready_to_reply: true`, `waha_status: "WORKING"`, `bridge_status: "online"` and `makaug_link.ok: true`, and a real inbound WhatsApp message receives a reply.'
            ].join('\n');
            if (existing) {
              const lastUpdate = new Date(existing.updated_at).getTime();
              if (Date.now() - lastUpdate >= 6 * 60 * 60 * 1000) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered WhatsApp outage incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Incident] MakaUG WhatsApp bot is offline';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}: the WhatsApp bridge is ready to reply (WAHA WORKING, bridge online, makaug link ok) and production health is available.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
