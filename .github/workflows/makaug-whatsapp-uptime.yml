name: MakaUG WhatsApp uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: makaug-whatsapp-uptime
  cancel-in-progress: true

jobs:
  verify:
    name: Hosted worker and AI runtime ready
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify isolated AI runtime and fresh worker heartbeat
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 \
            https://makaug-whatsapp-ai-runtime.onrender.com/ready)"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.ok !== true) throw new Error(`runtime not ready: ${process.argv[1]}`);
            if (payload.worker?.fresh !== true || payload.worker?.status !== "online") {
              throw new Error(`hosted WhatsApp worker is not fresh and online: ${process.argv[1]}`);
            }
            if (payload.openai_configured !== true) {
              throw new Error(`isolated OpenAI project is not configured: ${process.argv[1]}`);
            }
          ' "$response"

      - name: Verify production remains available
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://makaug.com/api/health >/dev/null

      - name: Open or update WhatsApp outage incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Incident] MakaUG WhatsApp bot is offline';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const body = [
              'The five-minute production check found that the hosted WhatsApp worker or AI runtime is not ready.',
              '',
              `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The bot must not be treated as restored until the worker reports a fresh `online` heartbeat and a real inbound WhatsApp message receives a reply.'
            ].join('\n');
            if (existing) {
              const lastUpdate = new Date(existing.updated_at).getTime();
              if (Date.now() - lastUpdate >= 6 * 60 * 60 * 1000) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered WhatsApp outage incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Incident] MakaUG WhatsApp bot is offline';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}: the hosted worker is fresh and online, the AI runtime is configured, and production health is available.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
